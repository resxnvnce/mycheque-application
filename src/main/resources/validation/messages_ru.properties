# Patch Remark Code explanations
@remark.ALREADY_PRESENT=Данный чек уже есть в Вашем профиле
@remark.DUPLICATED=Данный чек дублируется в том же запросе

@remark.OCCUPIED=Данный чек уже связан с профилем другого пользователя
@remark.UNRECOGNIZABLE=Невозможно распознать данный чек. Вы уверены, что данные верны?
@remark.TIMEOUT=Данный чек не может быть распознан прямо сейчас. Убедитесь, что данные верны, и повторите попытку через 15 минут

@remark.UNEXPECTED=Произошла непредвиденная ошибка. Пожалуйста, сообщите об этой проблеме

# Scenarios
@scenario.empty-result=Запрос вернул пустой результат. Вы уверены, что условия запроса верны?

@scenario.update=Обновление персональных данных успешно выполнено
@scenario.failed-update=Обновление персональных данных невозможно. Обнаружены ошибки: {0}
@scenario.registration=Регистрация успешно выполнена
@scenario.failed-registration=Регистрация невозможна. Обнаружены ошибки: {0}

@scenario.ok-outcome=Все предоставленные чеки были успешно привязаны к Вашему профилю.
@scenario.warning-outcome=Все предоставленные чеки были успешно привязаны к Вашему профилю, но есть некоторые предупреждения
@scenario.failure-outcome=Не удалось привязать чеки к Вашему профилю. Ознакомьтесь с описанием сбоев и убедитесь, что отправленные данные верны

@scenario.illegal-patchnotes=Невозможно применить патчи. Обнаружены ошибки: {0}
@scenario.illegal-receipt-query=Неверный запрос на чеки. Обнаружены ошибки: {0}

# Exceptions
@exception.token-already-in-use=Предоставленный сторонний API-ключ не может быть использован, так как уже используется другим пользователем

# Custom Constraints
@constraint.token#should-exist=Предоставленный сторонний API-ключ не существует или его срок действия истек
@constraint.username#should-not-be-taken=Данное имя пользователя уже используется. Попробуйте что-нибудь еще

# Bean Validation Constraints :: ItemQuery / ReceiptQuery
@past#ReceiptQuery.(min/max)_timestamp=Значения границ для поля #timestamp у чека могут соответствовать только моментам времени из прошлого

@positive#ReceiptQuery.(min/max)_total=Значения границ для поля #total у чека могут быть только положительными целыми числами

@positive#ItemQuery.(min/max)_price=Значения границ для поля #price у товара могут быть только положительными целыми числами
@positive#ItemQuery.(min/max)_count=Значения границ для поля #count у товара могут быть только положительными целыми числами

# Bean Validation Constraints :: Credentials / CredentialsUpdate
@pattern#Profile.username=Имя пользователя должно начинаться с латинской буквы, может содержать латиницу, цифры и знак нижнего подчеркивания. Требуемая длина: от 3 до 30 символов
@pattern#Profile.password=Пароль должен содержать прописную и заглавную латинские буквы, цифру и один из специальных знаков (@#$%&). Требуемая длина: от 4 до 31 символов

@not-null#Credentials.profile=Значение поля #profile должно быть указано

@not-null#Profile.username=Значение поля #username не может отсутствовать
@not-null#Profile.password=Значение поля #password не может отсутствовать

@not-blank#Credentials.token=Значение поля #token должно быть указано и не может быть пустым

# Bean Validation Constraints :: Patchnotes / ReceiptDefinition / FiscalDataRecord
@past#ReceiptDefinition.ByDetails.timestamp=Значение поля #timestamp может соответствовать только моменту времени из прошлого

@pattern#FiscalDataRecord.fn=Значение поля #fn фискального идентификатора должно быть строкой, состоящей только из цифр. Требуемая длина: от 4 до 31 символов
@pattern#FiscalDataRecord.fd=Значение поля #fd фискального идентификатора должно быть строкой, состоящей только из цифр. Требуемая длина: от 4 до 31 символов
@pattern#FiscalDataRecord.fp=Значение поля #fp фискального идентификатора должно быть строкой, состоящей только из цифр. Требуемая длина: от 4 до 31 символов

@not-null#ReceiptDefinition.ByDetails.id=Значение поля #id должно быть указано
@not-null#ReceiptDefinition.ByDetails.total=Значение поля #total не может отсутствовать
@not-null#ReceiptDefinition.ByDetails.timestamp=Значение поля #timestamp не может отсутствовать

@positive#ReceiptDefinition.ByDetails.total=Значение поля #total может быть только положительным числом с плавающей точкой

@not-blank#ReceiptDefinition.ByQrRaw.qrraw=Значение поля #qr_raw должно быть указано и не может быть пустым
@not-blank#ReceiptDefinition.ByQrUrl.qrurl=Значение поля #qr_url должно быть указано и не может быть пустым

@not-blank#FiscalDataRecord.fn=Значение поля #fn фискального идентификатора должно быть указано и не может быть пустым
@not-blank#FiscalDataRecord.fd=Значение поля #fd фискального идентификатора должно быть указано и не может быть пустым
@not-blank#FiscalDataRecord.fp=Значение поля #fp фискального идентификатора должно быть указано и не может быть пустым

@not-empty#Patchnotes.patches=Значение поля #patches должно быть указано и не может быть пустым
