# Patch Remark Code explanations
@remark.ALREADY_PRESENT=This receipt is already present in your profile
@remark.DUPLICATED=This receipt is duplicated within the same request

@remark.OCCUPIED=This receipt is already associated with another user's profile
@remark.UNRECOGNIZABLE=Cannot recognize this receipt. Are you sure the data is correct?
@remark.TIMEOUT=This receipt is in a timeout. Make sure the data is correct and try again in 15 minutes

@remark.UNEXPECTED=An unexpected error has occured. Please report this issue

# Scenarios
@scenario.update=Update has been completed successfully
@scenario.failed-update=Failed to update. Failures encountered: {0}
@scenario.registration=Registration has been completed successfully
@scenario.failed-registration=Failed to register. Failures encountered: {0}

@scenario.ok-outcome=All the receipts provided have been successfully added to your profile
@scenario.warning-outcome=All the receipts provided have been successfully added to your profile, but there are some warnings
@scenario.failure-outcome=Failed to add the receipts to your profile. Consider the failures description and make sure the data sent is correct

@scenario.illegal-patchnotes=Failed to apply patches. Failures encountered: {0}

# Custom Constraints
@constraint.token#should-exist=The third party API token provided either does not exist or has been expired
@constraint.username#should-not-be-taken=The given username is already taken. Try something else

# Bean Validation Constraints :: Credentials / CredentialsUpdate
@pattern#Profile.username=A username must start with a latin letter, may contain latin letters, numbers and underscores. Required length: from 3 to 30 characters
@pattern#Profile.password=A password must contain both an uppercase and a lowercase latin letter, a number and one of the special characters (@#$%&). Required length: from 4 to 31 characters

@not-null#Credentials.profile=The #profile property must be set

@not-null#Profile.username=The #username property cannot be unset
@not-null#Profile.password=The #password property cannot be unset

@not-blank#Credentials.token=The #token property must not be blank

# Bean Validation Constraints :: Patchnotes / ReceiptDefinition / FiscalDataRecord
@past#ReceiptDefinition.ByDetails.timestamp=The #timestamp property may only represent a date-time from the past

@pattern#FiscalDataRecord.fn=The #fn (#drive) property of a fiscal identifier must be a string consisting of digits only. Required length: from 4 to 31 characters
@pattern#FiscalDataRecord.fd=The #fd (#document) property of a fiscal identifier must be a string consisting of digits only. Required length: from 4 to 31 characters
@pattern#FiscalDataRecord.fp=The #fp (#sign) property of a fiscal identifier must be a string consisting of digits only. Required length: from 4 to 31 characters

@not-null#ReceiptDefinition.ByDetails.id=The #id property must be set
@not-null#ReceiptDefinition.ByDetails.total=The #id property must be set
@not-null#ReceiptDefinition.ByDetails.timestamp=The #id property must be set

@positive#ReceiptDefinition.ByDetails.total=The #total property may only be a positive floating point number

@not-blank#ReceiptDefinition.ByQrRaw.qrraw=The #qr_raw property must not be blank
@not-blank#ReceiptDefinition.ByQrUrl.qrurl=The #qr_url property must not be blank

@not-blank#FiscalDataRecord.fn=The #fn (#drive) property of a fiscal identifier must not be blank
@not-blank#FiscalDataRecord.fd=The #fd (#document) property of a fiscal identifier must not be blank
@not-blank#FiscalDataRecord.fp=The #fp (#sign) property of a fiscal identifier must not be blank

@not-empty#Patchnotes.patches=The #patches list must not be empty
